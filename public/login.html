<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Tally — Staff</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%27http://www.w3.org/2000/svg%27 viewBox=%270 0 32 32%27%3E%3Ccircle cx=%2716%27 cy=%2716%27 r=%2716%27 fill=%27%232f6b4f%27/%3E%3C/svg%3E">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Inter+Tight:wght@300;400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/style.css">
  <style>
    .home-link { color: inherit; text-decoration: none; }
    .demo-box { margin-top: 4px; text-align: center; }
    .demo-line { margin: 12px 0 0; font-size: 15px; color: var(--ink); }
    .back-link { display: flex; align-items: center; justify-content: center; margin-top: 8px; }
  </style>
</head>
<body>
  <div class="page">
    <header class="page-header">
      <h1><a href="/" class="home-link" aria-label="Tally, back to volunteer screen">Tally</a></h1>
      <button id="lang-toggle" class="lang-toggle" aria-label="Toggle language">EN</button>
    </header>
    <main>
      <form id="gate" class="name-section" style="margin-top:3rem">
        <label for="code" data-key="label">Staff passcode</label>
        <input type="text" id="code" inputmode="numeric" autocomplete="one-time-code" maxlength="8" style="-webkit-text-security:disc" autofocus>
        <button type="submit" class="send-btn" data-key="enter">Enter</button>
        <p id="err" class="no-concerns hidden" role="alert"></p>
        <!--demo--><div id="demo" class="demo-box">
          <p class="demo-line" data-key="demo">Demo passcode: 1121</p>
          <button type="button" id="demo-btn" class="secondary-btn" data-key="demoBtn">Use demo code</button>
        </div><!--/demo-->
        <a href="/" class="link-btn back-link" data-key="back">Back to volunteer screen</a>
      </form>
    </main>
  </div>
  <script src="/gate.js"></script>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Tally</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Ccircle cx='16' cy='16' r='16' fill='%2317181c'/%3E%3Cpath d='M9 17l5 5 9-11' stroke='white' stroke-width='3' fill='none'/%3E%3C/svg%3E">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Inter+Tight:wght@300;400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/style.css">
  <link rel="stylesheet" href="/volunteer.css">
  <link rel="stylesheet" href="/shift.css">
  <link rel="stylesheet" href="/tour.css">
  <link rel="stylesheet" href="/home.css">
  <link rel="stylesheet" href="/mobile.css">
</head>
<body class="has-rail vol-body">
  <div class="shell">
    <nav class="rail" aria-label="Tally">
      <span class="mark" role="img" aria-label="Tally"><i data-lucide="sparkle"></i></span>
    </nav>
    <div class="content">
      <div class="page volunteer-page">
        <header class="topbar">
          <span class="mark" role="img" aria-label="Tally"><i data-lucide="sparkle"></i></span>
          <div class="right">
            <nav class="side-switch" aria-label="Switch side"><a class="on" href="/" aria-current="page">Volunteer</a><a href="/staff">Staff</a></nav>
            <button id="tour-btn" class="icon-btn tour-btn" type="button" aria-label="Tour">?</button>
            <button id="speaker-toggle" class="icon-btn" aria-label="Voice"></button>
            <button id="lang-toggle" class="icon-btn" aria-label="Language">EN</button>
          </div>
        </header>

        <main>
          <section id="view-name" class="step hidden">
            <h2 class="big-q" data-key="askName">What's your first name?</h2>
            <form id="name-form">
              <input id="name-input" class="big-input" type="text" autocomplete="given-name" aria-labelledby="name-label" autofocus>
              <span id="name-label" class="sr-only" data-key="askName">What's your first name?</span>
              <button type="submit" class="primary-btn" data-key="continue">Continue</button>
            </form>
          </section>

          <section id="view-goal" class="step hidden">
            <h2 class="big-q" data-key="askGoal">Counting toward something?</h2>
            <div id="goal-chips" class="chips">
              <button class="chip" data-goal="100" data-label="Bright Futures 100">Bright Futures 100</button>
              <button class="chip" data-goal="75" data-label="Bright Futures 75">Bright Futures 75</button>
              <button class="chip" data-goal="school" data-key="goalSchool">School or court hours (type the number)</button>
              <button class="chip" data-goal="none" data-key="goalNone">Just count my hours</button>
            </div>
            <form id="goal-school" class="hidden">
              <input id="goal-hours" class="big-input" type="number" min="1" max="2000" inputmode="numeric" aria-label="Hours">
              <button type="submit" class="primary-btn" data-key="continue">Continue</button>
            </form>
          </section>

          <section id="view-home" class="hidden">
            <div id="tab-home" class="tab-panel home">
              <h2 class="headline home-head"><span id="home-hi" class="greeting"></span><br><span id="home-line"></span></h2>
              <p id="home-handled" class="banner home-handled hidden" role="status"></p>
              <div id="home-next" class="card lime home-next" aria-live="polite"></div>
              <div id="today-card" class="card today-card"></div>
              <div id="home-tiles" class="home-tiles"></div>
              <div id="home-links" class="home-links"></div>
            </div>
            <div id="tab-shift" class="tab-panel hidden">
            <div id="checkin-box" class="checkin-box"></div>
            <h2 class="headline"><span id="greeting" class="greeting"></span><br><span data-key="tellA">Tell us about your</span> <span data-key="tellB">shift</span></h2>
            <p id="handled-banner" class="banner hidden" role="status"></p>

            <div id="progress" class="card progress">
              <div class="num-row"><span id="ring-num" class="big-num">0</span><span id="ring-of" class="unit"></span></div>
              <div id="meter" class="capsules" role="img" aria-labelledby="ring-sub"></div>
              <p id="ring-sub" class="ring-sub"></p>
            </div>

            <div id="capture" class="capture">
              <div class="talk-wrap">
                <button id="talk-btn" class="talk-btn" aria-describedby="talk-label">
                  <span id="talk-icon" class="talk-icon"><svg viewBox="0 0 24 24" aria-hidden="true"><path fill="currentColor" d="M12 15a4 4 0 0 0 4-4V6a4 4 0 0 0-8 0v5a4 4 0 0 0 4 4zm6-4a6 6 0 0 1-12 0H4a8 8 0 0 0 7 7.93V22h2v-3.07A8 8 0 0 0 20 11h-2z"/></svg></span>
                  <span id="talk-inner" class="talk-inner" data-key="tapTalkShort">Tap to talk</span>
                </button>
              </div>
              <div id="rec-ui" class="rec-ui hidden"><div id="rec-timer" class="rec-timer">00:00</div><div id="levels" class="levels"></div></div>
              <p id="talk-label" class="talk-label">Tap and tell us about your shift</p>
              <button id="type-link" class="link-btn" data-key="orType" aria-expanded="false">Type instead</button>
              <div id="type-box" class="type-box hidden">
                <textarea id="text-input" rows="3" aria-label="Your shift"></textarea>
                <button id="send-text-btn" class="primary-btn" data-key="send">Send</button>
              </div>
              <p id="thinking" class="thinking hidden"><span class="dots"><i></i><i></i><i></i></span><span id="thinking-label">Counting...</span></p>
              <p id="msg" class="msg hidden" role="status" aria-live="polite"></p>
            </div>

            <div id="receipt-wrap" class="hidden" aria-live="polite">
              <div id="danger-top"></div>
              <div id="receipt-body" class="receipt card lime"></div>
              <div id="concern-card"></div>
              <button id="another-btn" class="secondary-btn" data-key="another">Tell us about another shift</button>
              <a id="letter-btn" class="secondary-btn" href="/letter" target="_blank" rel="noopener" data-key="letter">Get my hours letter</a>
            </div>
            </div>
            <div id="tab-tasks" class="tab-panel hidden"></div>
            <div id="tab-chat" class="tab-panel hidden"></div>
            <div id="tab-ask" class="tab-panel hidden"></div>
            <div id="tab-report" class="tab-panel hidden"></div>
            <nav id="vol-tabs" class="vol-tabs" aria-label="Tabs"></nav>
          </section>
        </main>

        <p id="timings" class="timings hidden"></p>
        <footer id="emergency" class="emergency"></footer>
      </div>
    </div>
  </div>
  <script src="/vendor/lucide.min.js"></script>
  <script src="/app.js"></script>
  <script src="/shift.js"></script>
  <script src="/tasks.js"></script>
  <script src="/chat.js"></script>
  <script src="/ask.js"></script>
  <script src="/report.js"></script>
  <script src="/after.js"></script>
  <script src="/home.js"></script>
  <script src="/tips.js"></script>
  <script src="/tour.js"></script>
</body>
</html>

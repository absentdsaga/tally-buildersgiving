<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Tally</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Ccircle cx='16' cy='16' r='16' fill='%232f6b4f'/%3E%3Cpath d='M9 17l5 5 9-11' stroke='white' stroke-width='3' fill='none'/%3E%3C/svg%3E">
  <link rel="stylesheet" href="/style.css">
</head>
<body>
  <div class="page volunteer-page">
    <header class="page-header">
      <h1>Tally</h1>
      <div class="header-actions">
        <a href="/staff" class="staff-link" data-key="staff">Staff</a>
        <button id="speaker-toggle" class="icon-btn" aria-label="Voice"></button>
        <button id="lang-toggle" class="icon-btn" aria-label="Language">EN</button>
      </div>
    </header>

    <main>
      <section id="view-name" class="step hidden">
        <h2 class="big-q" data-key="askName">What's your first name?</h2>
        <form id="name-form">
          <input id="name-input" class="big-input" type="text" autocomplete="given-name" aria-labelledby="name-label" autofocus>
          <span id="name-label" class="sr-only" data-key="askName">What's your first name?</span>
          <button type="submit" class="primary-btn" data-key="continue">Continue</button>
        </form>
      </section>

      <section id="view-goal" class="step hidden">
        <h2 class="big-q" data-key="askGoal">Counting toward something?</h2>
        <div id="goal-chips" class="chips">
          <button class="chip" data-goal="100" data-label="Bright Futures 100">Bright Futures 100</button>
          <button class="chip" data-goal="75" data-label="Bright Futures 75">Bright Futures 75</button>
          <button class="chip" data-goal="school" data-key="goalSchool">School or court hours (type the number)</button>
          <button class="chip" data-goal="none" data-key="goalNone">Just count my hours</button>
        </div>
        <form id="goal-school" class="hidden">
          <input id="goal-hours" class="big-input" type="number" min="1" max="2000" inputmode="numeric" aria-label="Hours">
          <button type="submit" class="primary-btn" data-key="continue">Continue</button>
        </form>
      </section>

      <section id="view-home" class="hidden">
        <h2 id="greeting" class="greeting"></h2>
        <p id="handled-banner" class="banner hidden" role="status"></p>
        <div class="ring-wrap">
          <svg id="ring" viewBox="0 0 200 200" role="img" aria-labelledby="ring-sub">
            <circle class="ring-track" cx="100" cy="100" r="86"/>
            <circle id="ring-waiting" class="ring-arc ring-waiting" cx="100" cy="100" r="86"/>
            <circle id="ring-approved" class="ring-arc ring-approved" cx="100" cy="100" r="86"/>
          </svg>
          <div class="ring-center"><div id="ring-num" class="ring-num">0</div><div id="ring-of" class="ring-of"></div></div>
        </div>
        <p id="ring-sub" class="ring-sub"></p>

        <div id="capture" class="capture">
          <button id="talk-btn" class="talk-btn" aria-describedby="talk-label">
            <svg viewBox="0 0 24 24" aria-hidden="true"><path fill="currentColor" d="M12 15a4 4 0 0 0 4-4V6a4 4 0 0 0-8 0v5a4 4 0 0 0 4 4zm6-4a6 6 0 0 1-12 0H4a8 8 0 0 0 7 7.93V22h2v-3.07A8 8 0 0 0 20 11h-2z"/></svg>
          </button>
          <div id="rec-ui" class="rec-ui hidden"><div id="rec-timer" class="rec-timer">00:00</div><div id="levels" class="levels"></div></div>
          <p id="talk-label" class="talk-label">Tap and tell us about your shift</p>
          <button id="type-link" class="link-btn" data-key="orType" aria-expanded="false">or type it</button>
          <div id="type-box" class="type-box hidden">
            <textarea id="text-input" rows="3" aria-label="Your shift"></textarea>
            <button id="send-text-btn" class="primary-btn" data-key="send">Send</button>
          </div>
          <p id="thinking" class="thinking hidden"><span class="dots"></span><span id="thinking-label">Counting...</span></p>
          <p id="msg" class="msg hidden" role="status" aria-live="polite"></p>
        </div>

        <div id="receipt-wrap" class="hidden" aria-live="polite">
          <div id="receipt-body" class="receipt"></div>
          <button id="another-btn" class="primary-btn" data-key="another">Tell us about another shift</button>
          <a id="letter-btn" class="secondary-btn" href="/letter" target="_blank" rel="noopener" data-key="letter">Get my hours letter</a>
        </div>
      </section>
    </main>

    <p id="timings" class="timings hidden"></p>
    <footer id="emergency" class="emergency"></footer>
  </div>
  <script src="/app.js"></script>
</body>
</html>

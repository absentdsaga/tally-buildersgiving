<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Tally — Staff</title>
  <link rel="stylesheet" href="/style.css">
</head>
<body>
  <div class="page staff-page">
    <header class="page-header">
      <h1>Tally</h1>
      <button id="lang-toggle" class="lang-toggle" aria-label="Toggle language">EN</button>
    </header>

    <main>
      <section class="concerns-section">
        <h2 data-key="needsYouToday">Needs you today</h2>
        <div id="concerns-list" class="concerns-list"></div>
        <p id="no-concerns" class="no-concerns hidden" data-key="noConcerns">No urgent concerns today. Great work!</p>
      </section>

      <section class="hours-section">
        <h2 data-key="hoursThisWeek">Hours this week</h2>
        <div class="hours-big" id="total-hours">0</div>

        <h3 data-key="byVolunteer">By volunteer</h3>
        <div id="volunteer-hours" class="volunteer-hours"></div>
      </section>

      <section class="log-section">
        <h2 data-key="allUpdates">All updates</h2>
        <div id="updates-log" class="updates-log"></div>
      </section>
    </main>

    <nav class="bottom-nav">
      <a href="/" class="nav-item" data-key="volunteer">Volunteer</a>
      <a href="/staff" class="nav-item active" data-key="staff">Staff</a>
    </nav>
  </div>

  <script src="/staff.js"></script>
</body>
</html>

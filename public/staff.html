<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Tally — Staff</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Ccircle cx='16' cy='16' r='16' fill='%232f6b4f'/%3E%3C/svg%3E">
  <link rel="stylesheet" href="/style.css">
</head>
<body>
  <div class="page staff-page">
    <header class="page-header">
      <h1>Tally</h1>
      <div class="header-actions">
        <a href="/" class="staff-link" data-key="volunteer">Volunteer</a>
        <button id="lang-toggle" class="icon-btn" aria-label="Language">EN</button>
      </div>
    </header>
    <main>
      <div class="who-row"><label for="who" data-key="who">Your name</label><input id="who" type="text" autocomplete="name"></div>
      <p id="status" class="msg hidden" role="status" aria-live="polite"></p>

      <section class="stats" aria-label="Summary">
        <div class="stat"><div id="stat-hours" class="stat-num">0</div><div class="stat-label" data-key="hoursWeek">Hours this week</div><div id="stat-waiting" class="stat-sub"></div></div>
        <div class="stat"><div id="stat-dollars" class="stat-num">$0</div><div class="stat-label" data-key="worth">Worth to funders</div><div id="stat-rate" class="stat-sub"></div></div>
        <div class="stat"><div id="stat-vols" class="stat-num">0</div><div class="stat-label" data-key="volunteers">Volunteers</div></div>
      </section>

      <section>
        <h2 data-key="attention">Needs attention</h2>
        <div id="concerns"></div>
        <details id="handled-wrap" class="hidden"><summary id="handled-sum"></summary><div id="handled"></div></details>
      </section>

      <section>
        <div class="row-between"><h2 data-key="waitingOk">Waiting for your OK</h2><button id="approve-all" class="small-btn hidden" data-key="approveAll">Approve all</button></div>
        <div id="waiting"></div>
        <details id="dups-wrap" class="hidden"><summary id="dups-sum"></summary><div id="dups"></div></details>
      </section>

      <section id="quiet-wrap" class="hidden">
        <h2 data-key="quiet">Haven't heard from in 3+ weeks</h2>
        <div id="quiet"></div>
      </section>

      <details class="tables"><summary data-key="byVolunteer">By volunteer</summary><div id="by-volunteer"></div></details>
      <details class="tables"><summary data-key="bySite">By site (this week vs last week)</summary><div id="by-site"></div></details>

      <a id="report-btn" class="primary-btn" href="/api/report.csv" data-key="report">Download grant report</a>
      <p class="demo"><button id="sample-btn" class="link-btn" data-key="demo">demo</button></p>
    </main>
  </div>
  <script src="/staff.js"></script>
</body>
</html>
